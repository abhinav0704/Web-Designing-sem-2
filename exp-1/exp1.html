<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Layout</title>

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body{
            background-color: #f2f2f2;
        }

        .header{
            
            color: white;
            text-align: center;
            padding: 40px;
        }

        .navbar-custom{
            background-color: black;
        }

        .navbar-custom a{
            color: white;
            text-decoration: none;
            margin: 10px;
        }

        .content{
            background-color: white;
            padding: 40px 20px;
        }

        .column-box{
            min-height: 120px;
            padding: 20px;
        }

        .border-right{
            border-right: 2px solid gray;
        }

        .footer{
            background-color: black;
            color: white;
            text-align: center;
            padding: 10px;
        }
    </style>
</head>

<body>

<div class="container ">
    <div class="header bg-primary">
        <h1>My Website</h1>
    </div>
    <div class="navbar-custom d-flex justify-content-between p-2">
        <div>
            <a href="#">Website</a>
        </div>

        <div>
            <a href="#">Home</a>
         
        </div>
    </div>

    <div class="content">
        <div class="row">

            <div class="col-sm-12 col-md-6 col-lg-6 column-box border-right">
                <h4>Column 1</h4>
                <p>
                    This is this first column. On small occupies full width, while on medium and large devices it occupies half width using Bootstrap grid classes.
                </p>
            </div>

            <div class="col-sm-12 col-md-6 col-lg-6 column-box">
                <h4>Column 2</h4>
                <p>
                   This is a second column.
                </p>
            </div>

        </div>
    </div>

    <!-- Footer -->
    <div class="footer">
        Copyright © 2026 My Website
    </div>

</div>

</body>
</html>
